    border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    padding:10px 16px;cursor:pointer;transition:color .2s,border-color .2s}
  #soundBtn.on{color:var(--amber);border-color:var(--amber)}
  #soundBtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @keyframes attractPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,180,84,.55);border-color:var(--amber)}

    .player{margin-top:34px}
    footer{margin-top:38px}
  }

  const N = 60, SHEET_COLS = 10, TS = 120;
  const NAMES = ["Crescendo at Dusk","Sunset Groove","Let the Music","Beautiful Blues","Through the Storm","Cesta Domov","Unstoppable","Can You Find Me Now","Rising Above","Eternal Flow","The Road Ahead","Inner Peace","Lightning in the Bottle","Fire Moon","Blessing of the Twins","Breaking Through","Cez Doliny Cez Hory","Electric Storm","Desert of Absence","Labyrinth of Life","Searching for the Feeling","My Heart Goes","Liquid Devotion","Spoved","Klinika 8","Mami Ty Si Moj Domov","Melodia Nadeje","Nitra Moje Mesto","Neon Frenzy","Face the Storm","Stay Awhile and Listen","Dreamin","Darkness","Broken Pieces","Endlessness","Echoes of Tomorrow Vol. 2","Quote Song","Never Know","Puzzle","S I N","Saxobass Beat","Breaking Free","Light My Way","Hypnotized","Falling for You","Dopamine","Made of Stone","R.E.S.T.a.R.T","Out of the Ashes","Olas De Alegria","Let Me Go","Running Away","Find Me","Echoes of Tomorrow","Night Passion","Positive Vibes","Sunset Reflection","Healing the Soul","Chillout on the Route","Melancholy"];

  const canvas = document.getElementById('facade');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('soundBtn');
  const np  = document.getElementById('nowPlaying');
  const hint = document.getElementById('soundHint');
  function syncHint(){ hint.style.width = btn.offsetWidth + 'px'; }
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = new Image();

  let cols, rows, cell, order = [], lights = [];
  let soundOn = false, fadeTimer = null;
  let singer = null;              // {idx, a, dir, pulse}
  let nextSingAt = 0;
  const previews = {};
  let previewCount = 0;

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}

  // ---------- previews: fetch with CORS, fallback JSONP ----------
  function ingest(data){
    (data.results||[]).forEach(r=>{
      if(r.previewUrl && r.trackName){ const k=norm(r.trackName); if(!previews[k]){previews[k]={url:r.previewUrl, full:r.trackName}; previewCount++;} }
    });
    if(soundOn) btn.textContent = 'SOUND ON · ' + previewCount;
    syncHint();
  }
  function loadPreviews(){
    const url = 'https://itunes.apple.com/lookup?id=1554274941&entity=song&limit=200';
    fetch(url).then(r=>r.json()).then(ingest).catch(()=>{
      const cb = 'itcb_' + Math.random().toString(36).slice(2);
      window[cb] = function(d){ ingest(d); delete window[cb]; };
      const s = document.createElement('script');
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }
  function previewFor(tileIdx){
    const key = norm(NAMES[tileIdx % NAMES.length] || '');
    if(previews[key]) return previews[key];
    for(const k in previews){ if(k.startsWith(key) || key.startsWith(k)) return previews[k]; }
    return null;
  }

  // ---------- audio: single persistent player (iOS-safe) ----------
  const player = new Audio();
  player.preload = 'auto';
  let unlocked = false, canFade = true, playToken = 0, singGi = -1;
  const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';

  function unlockAudio(){
    if(unlocked) return;
    player.src = SILENCE;
    player.play().then(()=>{ player.pause(); unlocked = true; }).catch(()=>{});
    // detect whether volume is scriptable (iPhone: it is not)
    try { player.volume = 0.5; canFade = (player.volume < 0.9); player.volume = 1; } catch(e){ canFade = false; }
  }
  function stopAudio(fast){
    clearInterval(fadeTimer);
    playToken++;
    np.classList.remove('show');
    if(player.paused) return;
    if(fast || !canFade){ player.pause(); return; }
    const tk = playToken;
    fadeTimer = setInterval(()=>{
      if(playToken!==tk){ clearInterval(fadeTimer); return; }
      player.volume = Math.max(0, player.volume - 0.028);
      if(player.volume<=0){ player.pause(); clearInterval(fadeTimer); }
    },60);
  }
  function sing(gi){
    const p = previewFor(order[gi]);
    stopAudio(true);
    singer = {idx: gi, a: 0, dir: 1, t0: performance.now()};
    if(!p || !soundOn){ setTimeout(()=>{ if(singer && singer.idx===gi) singer.dir=-1; }, 4000); nextSingAt = performance.now() + 5000; return; }
    const tk = ++playToken; singGi = gi;
    player.src = p.url;
    player.volume = canFade ? 0 : 1;
    const onMeta = ()=>{ player.removeEventListener('loadedmetadata', onMeta); try{ player.currentTime = 3; }catch(e){} };
    player.addEventListener('loadedmetadata', onMeta);
    player.play().then(()=>{
      if(playToken!==tk) return;
      if(canFade){
        clearInterval(fadeTimer);
        fadeTimer = setInterval(()=>{ if(playToken!==tk){clearInterval(fadeTimer);return;} player.volume = Math.min(0.85, player.volume + 0.09); },60);
      }
      np.textContent = '\u25B6 ' + p.full;
      np.classList.add('show');
      setTimeout(()=>{ if(playToken===tk){ stopAudio(false); if(singer && singer.idx===gi) singer.dir=-1; } }, 13500);
    }).catch(()=>{});
    nextSingAt = performance.now() + 16000;   // 13.5s play + 1.5s fade + 1s gap
  }
  player.addEventListener('ended', ()=>{
    np.classList.remove('show');
    if(singer && singer.idx===singGi) singer.dir=-1;
    nextSingAt = Math.min(nextSingAt, performance.now() + 1000);
  });

  // ---------- layout ----------
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cell = innerWidth < 600 ? 62 : 96;
    const newCols = Math.ceil(innerWidth/cell), newRows = Math.ceil(innerHeight/cell);
    if(newCols !== cols || order.length === 0){
      // real layout change (rotation / width) -> rebuild facade
      cols = newCols; rows = newRows;
      order = shuffle([...Array(cols*rows)].map((_,i)=>i%N));
      seedAmbient();
      if(singer && singer.idx >= cols*rows) singer = null;
    } else {
      // height-only change (mobile URL bar) -> keep mapping, just extend if needed
      rows = newRows;
      while(order.length < cols*rows) order.push(order.length % N);
      lights = lights.filter(L=>L.idx < cols*rows);
      if(singer && singer.idx >= cols*rows) singer.dir = -1;
    }
    draw();
  }
  function newAmbient(mature){
    return {idx: Math.floor(Math.random()*cols*rows), a: mature?Math.random()*0.5:0, dir:1,
            speed: 0.002+Math.random()*0.003, hold: 260+Math.random()*700};
  }
  function seedAmbient(){
    lights = [];
    const n = Math.max(7, Math.round(cols*rows*0.030));
    for(let i=0;i<n;i++) lights.push(newAmbient(true));
  }

  // ---------- drawing ----------
  function tileXY(gi){ return [(gi%cols)*cell, Math.floor(gi/cols)*cell]; }
  function drawTile(gi, alpha){
    const t = order[gi];
    const al = Math.min(1, Math.max(0, alpha));
    const sx=(t%SHEET_COLS)*TS, sy=Math.floor(t/SHEET_COLS)*TS;
    const [x,y]=tileXY(gi);
    ctx.globalAlpha=1; ctx.drawImage(img,sx,sy,TS,TS,x,y,cell-2,cell-2);
    ctx.globalAlpha=1-al; ctx.fillStyle='#0d0f16'; ctx.fillRect(x,y,cell-2,cell-2);
    ctx.globalAlpha=1;
  }
  function glow(gi, a, radius, strength){
    const [x0,y0]=tileXY(gi); const x=x0+cell/2, y=y0+cell/2;
    const g = ctx.createRadialGradient(x,y,cell*0.2,x,y,radius);
    g.addColorStop(0,'rgba(255,180,84,'+(strength*a).toFixed(3)+')');
    g.addColorStop(0.4,'rgba(255,180,84,'+(0.35*strength*a).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,180,84,0)');
    ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
    ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
    ctx.globalCompositeOperation='source-over';
  }
  function frame(gi, a){
    const [x,y]=tileXY(gi);
    ctx.save();
    ctx.shadowColor='rgba(255,190,100,'+(0.95*a).toFixed(3)+')';
    ctx.shadowBlur=10;
    ctx.strokeStyle='rgba(255,225,170,'+(1.0*a).toFixed(3)+')';
    ctx.lineWidth=1.5;
    ctx.setLineDash([9,6]);
    ctx.lineDashOffset = -(performance.now()/40) % 15;   // dashes travel clockwise
    ctx.strokeRect(x+0.5,y+0.5,cell-3,cell-3);
    ctx.strokeRect(x+0.5,y+0.5,cell-3,cell-3);
    ctx.restore();
  }
  function draw(){
    ctx.fillStyle='#0d0f16'; ctx.fillRect(0,0,innerWidth,innerHeight);
    const DIM=0.14;
    for(let gi=0;gi<cols*rows;gi++) drawTile(gi,DIM);
    // ambient: modest brightness, small glow, NO sound
    for(const L of lights){ glow(L.idx,L.a,cell*1.6,0.32); drawTile(L.idx,DIM+0.72*L.a); }
    // singer: dominant — big pulsing glow, full brightness, bright frame
    if(singer){
      const pulse = 1 + 0.15*Math.sin((performance.now()-singer.t0)/280);
      glow(singer.idx, singer.a*pulse, cell*2.1, 0.34);
      drawTile(singer.idx, DIM + 0.90*singer.a);
      frame(singer.idx, singer.a);
    }
  }
  function tick(now){
    for(let i=0;i<lights.length;i++){
      const L=lights[i];
      if(L.dir===1){L.a+=L.speed; if(L.a>=0.80){L.a=0.80; if(--L.hold<=0)L.dir=-1;}}
      else{L.a-=L.speed; if(L.a<=0) lights[i]=newAmbient(false);}
    }
    if(singer){
      if(singer.dir===1){ singer.a=Math.min(1, singer.a+0.05); }
      else{ singer.a-=0.02; if(singer.a<=0) singer=null; }
    }
    if(soundOn && !singer && now>nextSingAt){
      sing(pickVisibleTile());
    }
    draw();
    requestAnimationFrame(tick);
  }

  const pageEl = document.querySelector('.page');
  function pickVisibleTile(){
    const r = pageEl.getBoundingClientRect();
    for(let i=0;i<50;i++){
      const gi = Math.floor(Math.random()*cols*rows);
      const cx = (gi%cols)*cell + cell/2, cy = Math.floor(gi/cols)*cell + cell/2;
      if(cy<0 || cy>innerHeight) continue;
      const insideContent = cx > r.left-6 && cx < r.right+6 && cy > r.top-6 && cy < r.bottom+6;
      if(!insideContent) return gi;
    }
    return Math.floor(Math.random()*cols*rows);
  }
  // ---------- interaction ----------
  btn.addEventListener('click', ()=>{
    btn.classList.remove('attract');
    unlockAudio();
    soundOn=!soundOn;
    btn.classList.toggle('on',soundOn);
    btn.setAttribute('aria-pressed',soundOn);
    if(soundOn){
      btn.textContent = previewCount? 'SOUND ON · '+previewCount : 'SOUND ON · loading';
      syncHint();
      if(!previewCount) loadPreviews();
      nextSingAt = 0;
    } else {
      btn.textContent='SOUND OFF';
      syncHint();
      stopAudio(false);
      if(singer) singer.dir=-1;
    }
  });
  canvas.addEventListener('click',(e)=>{
    const gi = Math.floor(e.clientX/cell)+Math.floor(e.clientY/cell)*cols;
    if(gi<0||gi>=cols*rows) return;
    if(singer && !player.paused && singer.idx===gi) return;
    if(singer) singer.dir=-1;
    sing(gi);
  });

  img.onload = function(){ resize(); loadPreviews(); if(!reduced) requestAnimationFrame(tick); else draw(); };
  img.src = TILE_SRC;
  addEventListener('resize', ()=>{ resize(); syncHint(); });
  setTimeout(syncHint, 300); setTimeout(syncHint, 1200);
})();
</script>
</body>
</html>
