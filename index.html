  const N = 59, SHEET_COLS = 10, TS = 120;
  const NAMES = ["Crescendo at Dusk","Sunset Groove","Let the Music","Beautiful Blues","Through the Storm","Cesta Domov","Unstoppable","Can You Find Me Now","Rising Above","Eternal Flow","The Road Ahead","Inner Peace","Lightning in the Bottle","Fire Moon","Blessing of the Twins","Breaking Through","Cez Doliny Cez Hory","Electric Storm","Desert of Absence","Labyrinth of Life","Searching for the Feeling","My Heart Goes","Liquid Devotion","Spoved","Klinika 8","Mami Ty Si Moj Domov","Melodia Nadeje","Nitra Moje Mesto","Neon Frenzy","Face the Storm","Stay Awhile and Listen","Dreamin","Darkness","Broken Pieces","Endlessness","Echoes of Tomorrow Vol. 2","Quote Song","Never Know","Puzzle","S I N","Saxobass Beat","Breaking Free","Light My Way","Hypnotized","Falling for You","Dopamine","Made of Stone","R.E.S.T.a.R.T","Out of the Ashes","Olas De Alegria","Let Me Go","Running Away","Find Me","Echoes of Tomorrow","Night Passion","Positive Vibes","Sunset Reflection","Healing the Soul","Chillout on the Route"];

  const canvas = document.getElementById('facade');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('soundBtn');
  const np  = document.getElementById('nowPlaying');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const img = new Image();

  let cols, rows, cell, order = [], lights = [];
  let soundOn = false, audio = null, fadeTimer = null;
  let singer = null;              // {idx, a, dir, pulse}
  let nextSingAt = 0;
  const previews = {};
  let previewCount = 0;

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}

  // ---------- previews: fetch with CORS, fallback JSONP ----------
  function ingest(data){
    (data.results||[]).forEach(r=>{
      if(r.previewUrl && r.trackName){ const k=norm(r.trackName); if(!previews[k]){previews[k]={url:r.previewUrl, full:r.trackName}; previewCount++;} }
    });
    if(soundOn) btn.textContent = 'SOUND ON · ' + previewCount;
  }
  function loadPreviews(){
    const url = 'https://itunes.apple.com/lookup?id=1554274941&entity=song&limit=200';
    fetch(url).then(r=>r.json()).then(ingest).catch(()=>{
      const cb = 'itcb_' + Math.random().toString(36).slice(2);
      window[cb] = function(d){ ingest(d); delete window[cb]; };
      const s = document.createElement('script');
      s.src = url + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }
  function previewFor(tileIdx){
    const key = norm(NAMES[tileIdx % NAMES.length] || '');
    if(previews[key]) return previews[key];
    for(const k in previews){ if(k.startsWith(key) || key.startsWith(k)) return previews[k]; }
    return null;
  }

  // ---------- audio ----------
  function stopAudio(fast){
    clearInterval(fadeTimer);
    if(!audio) return;
    const a = audio; audio = null;
    if(fast){ a.pause(); }
    else { const f = setInterval(()=>{ a.volume=Math.max(0,a.volume-0.028); if(a.volume<=0){a.pause();clearInterval(f);} },60); }
    np.classList.remove('show');
  }
  function sing(gi){
    const p = previewFor(order[gi]);
    stopAudio(true);
    singer = {idx: gi, a: 0, dir: 1, t0: performance.now()};
    if(!p || !soundOn){ nextSingAt = performance.now() + 9000; return; }
    const a = new Audio(p.url);
    a.volume = 0; audio = a;
    a.currentTime = 3;
    a.play().then(()=>{
      clearInterval(fadeTimer);
      fadeTimer = setInterval(()=>{ if(audio!==a){clearInterval(fadeTimer);return;} a.volume=Math.min(0.85,a.volume+0.09); },60);
      np.textContent = '\u25B6 ' + p.full;
      np.classList.add('show');
      setTimeout(()=>{ if(audio===a){ stopAudio(false); if(singer && singer.idx===gi) singer.dir=-1; } }, 13500);
    }).catch(()=>{});
    nextSingAt = performance.now() + 16000;   // 13.5s play + 1.5s fade + 1s gap
  }

  // ---------- layout ----------
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cell = innerWidth < 600 ? 78 : 96;
    cols = Math.ceil(innerWidth/cell); rows = Math.ceil(innerHeight/cell);
    order = shuffle([...Array(cols*rows)].map((_,i)=>i%N));
    seedAmbient(); draw();
  }
  function newAmbient(mature){
    return {idx: Math.floor(Math.random()*cols*rows), a: mature?Math.random()*0.5:0, dir:1,
            speed: 0.002+Math.random()*0.003, hold: 260+Math.random()*700};
  }
  function seedAmbient(){
    lights = [];
    const n = Math.max(3, Math.round(cols*rows*0.012));
    for(let i=0;i<n;i++) lights.push(newAmbient(true));
  }

  // ---------- drawing ----------
  function tileXY(gi){ return [(gi%cols)*cell, Math.floor(gi/cols)*cell]; }
  function drawTile(gi, alpha){
    const t = order[gi];
    const sx=(t%SHEET_COLS)*TS, sy=Math.floor(t/SHEET_COLS)*TS;
    const [x,y]=tileXY(gi);
    ctx.globalAlpha=1; ctx.drawImage(img,sx,sy,TS,TS,x,y,cell-2,cell-2);
    ctx.globalAlpha=1-alpha; ctx.fillStyle='#0d0f16'; ctx.fillRect(x,y,cell-2,cell-2);
    ctx.globalAlpha=1;
  }
  function glow(gi, a, radius, strength){
    const [x0,y0]=tileXY(gi); const x=x0+cell/2, y=y0+cell/2;
    const g = ctx.createRadialGradient(x,y,cell*0.2,x,y,radius);
    g.addColorStop(0,'rgba(255,180,84,'+(strength*a).toFixed(3)+')');
    g.addColorStop(0.4,'rgba(255,180,84,'+(0.35*strength*a).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,180,84,0)');
    ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
    ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
    ctx.globalCompositeOperation='source-over';
  }
  function frame(gi, a){
    const [x,y]=tileXY(gi);
    ctx.strokeStyle='rgba(255,200,120,'+(0.9*a).toFixed(3)+')';
    ctx.lineWidth=1.5; ctx.strokeRect(x+0.5,y+0.5,cell-3,cell-3);
  }
  function draw(){
    ctx.fillStyle='#0d0f16'; ctx.fillRect(0,0,innerWidth,innerHeight);
    const DIM=0.10;
    for(let gi=0;gi<cols*rows;gi++) drawTile(gi,DIM);
    // ambient: modest brightness, small glow, NO sound
    for(const L of lights){ glow(L.idx,L.a,cell*1.6,0.28); drawTile(L.idx,DIM+0.62*L.a); }
    // singer: dominant — big pulsing glow, full brightness, bright frame
    if(singer){
      const pulse = 1 + 0.15*Math.sin((performance.now()-singer.t0)/280);
      glow(singer.idx, singer.a*pulse, cell*4.2, 0.55);
      drawTile(singer.idx, DIM + 0.90*singer.a);
      frame(singer.idx, singer.a);
    }
  }
  function tick(now){
    for(let i=0;i<lights.length;i++){
      const L=lights[i];
      if(L.dir===1){L.a+=L.speed; if(L.a>=0.70){L.a=0.70; if(--L.hold<=0)L.dir=-1;}}
      else{L.a-=L.speed; if(L.a<=0) lights[i]=newAmbient(false);}
    }
    if(singer){
      if(singer.dir===1){ singer.a=Math.min(1, singer.a+0.05); }
      else{ singer.a-=0.02; if(singer.a<=0) singer=null; }
    }
    if(soundOn && !singer && now>nextSingAt){
      sing(Math.floor(Math.random()*cols*rows));
    }
    draw();
    requestAnimationFrame(tick);
  }

  // ---------- interaction ----------
  btn.addEventListener('click', ()=>{
    btn.classList.remove('attract');
    soundOn=!soundOn;
    btn.classList.toggle('on',soundOn);
    btn.setAttribute('aria-pressed',soundOn);
    if(soundOn){
      btn.textContent = previewCount? 'SOUND ON · '+previewCount : 'SOUND ON · loading';
      if(!previewCount) loadPreviews();
      nextSingAt = 0;
    } else {
      btn.textContent='SOUND OFF';
      stopAudio(false);
      if(singer) singer.dir=-1;
    }
  });
  canvas.addEventListener('click',(e)=>{
    const gi = Math.floor(e.clientX/cell)+Math.floor(e.clientY/cell)*cols;
    if(gi<0||gi>=cols*rows) return;
    if(singer && audio) { if(singer.idx===gi) return; }
    if(singer) singer.dir=-1;
    sing(gi);
  });

  img.onload = function(){ resize(); loadPreviews(); if(!reduced) requestAnimationFrame(tick); else draw(); };
  img.src = TILE_SRC;
  addEventListener('resize', resize);
})();
</script>
</body>
</html>
